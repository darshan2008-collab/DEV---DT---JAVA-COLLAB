version: '3.8'

services:
  postgres:
    image: postgres:16-alpine
    container_name: smart-ambulance-postgres
    environment:
      POSTGRES_DB: ${DB_NAME:-smartambulance}
      POSTGRES_USER: ${DB_USER:-ambulance_admin}
      POSTGRES_PASSWORD: ${DB_PASSWORD:-ambulance_secret_2026}
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ambulance_admin -d smartambulance"]
      interval: 5s
      timeout: 5s
      retries: 5

  mosquitto:
    image: eclipse-mosquitto:2
    container_name: smart-ambulance-mosquitto
    ports:
      - "1883:1883"
    command: mosquitto -c /mosquitto-no-auth.conf

  backend-java:
    build:
      context: ./backend-java
      dockerfile: Dockerfile
    container_name: smart-ambulance-backend
    environment:
      SPRING_PROFILES_ACTIVE: docker
      DB_HOST: postgres
      DB_PORT: 5432
      DB_NAME: ${DB_NAME:-smartambulance}
      DB_USER: ${DB_USER:-ambulance_admin}
      DB_PASSWORD: ${DB_PASSWORD:-ambulance_secret_2026}
      MQTT_HOST: mosquitto
      MQTT_PORT: 1883
      JWT_SECRET: ${JWT_SECRET:-smart-ambulance-super-secret-key-for-jwt-tokens-at-least-256-bits-long!}
    ports:
      - "8080:8080"
    depends_on:
      postgres:
        condition: service_healthy
      mosquitto:
        condition: service_started

  vision-service:
    build:
      context: ./vision-service
      dockerfile: Dockerfile
    container_name: smart-ambulance-vision
    environment:
      BACKEND_URL: http://backend-java:8080/api
      MODEL_PATH: yolov8n.pt
    ports:
      - "8000:8000"
    depends_on:
      - backend-java

  dashboard:
    build:
      context: ./dashboard
      dockerfile: Dockerfile
    container_name: smart-ambulance-dashboard
    environment:
      BACKEND_URL: http://backend-java:8080/api
      VISION_URL: http://vision-service:8000
    ports:
      - "8501:8501"
    depends_on:
      - backend-java

volumes:
  postgres_data:
